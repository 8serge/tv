name: Update TV Links

on:
  schedule:
    # Запуск каждые 2 часа
    - cron: '0 */2 * * *'
  workflow_dispatch: # Кнопка для ручного запуска

permissions:
  id-token: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ШАГ 1: Подключение к Tailscale через ваш телефон Nokia 6
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # IP вашего Nokia 6 из Tailscale. Трафик пойдет через ваш домашний интернет.
          args: "--exit-node=100.87.60.90 --exit-node-allow-lan-access=true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers and Dependencies
        run: |
          playwright install --with-deps chromium

      # ШАГ 2: Запуск скрипта (теперь он работает через ваш домашний IP)
      - name: Run Stream Updater Script
        run: python update_streams.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.m3u8
          git diff --staged --quiet || git commit -m "Auto-update stream URLs via Tailscale [skip ci]"
          git push
