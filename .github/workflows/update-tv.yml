name: Update TV Links

on:
  schedule:
    # Запуск каждые 2 часа (в 00:00, 02:00, 04:00 и т.д.)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даёт право сохранять изменения в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers and Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Stream Updater Script
        run: python update_streams.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.m3u8
          # Если файл не изменился, коммит не создастся, и это нормально
          git diff --staged --quiet || git commit -m "Auto-update stream URLs [skip ci]"
          git push
