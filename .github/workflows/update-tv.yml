name: Update TV Links

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Браузер качается на быстрой сети GitHub, ДО подключения к телефону!
      - name: Install Playwright Browsers and Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Cleanup previous Tailscale
        run: |
          sudo systemctl stop tailscaled || true
          sudo pkill -9 tailscaled || true
          sudo rm -f /usr/local/bin/tailscale /usr/local/bin/tailscaled || true
        continue-on-error: true

      # Подключаемся к телефону ТОЛЬКО для запуска скрипта
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: "--exit-node=100.87.60.90 --exit-node-allow-lan-access=true"

      - name: Run Stream Updater Script
        run: python update_streams.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.m3u8
          git diff --staged --quiet || git commit -m "Auto-update stream URLs via Tailscale [skip ci]"
          git push
